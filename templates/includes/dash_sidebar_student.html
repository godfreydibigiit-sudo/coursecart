{% load static %}
<aside class="dash-sidebar" id="dashSidebar">
    <!-- Brand Header -->
    <div class="dash-sidebar-header">
    <div class="dash-logo">
        <img src="{% static 'images/logo.png' %}" alt="CourseCart Logo" class="sidebar-logo-img">
    </div>
    <div class="dash-brand">
        <span class="brand-text">CourseCart</span>
    </div>
</div>
    
    <!-- Navigation -->
    <nav class="dash-sidebar-nav">
        <!-- Main Section -->
        <span class="dash-nav-section">Main Menu</span>
        
        <a href="{% url 'profiles:student_dashboard' %}" class="dash-nav-item active">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
            </span>
            <span class="nav-label">Dashboard</span>
        </a>
        
        <a href="{% url 'courses:my_enrollments' %}" class="dash-nav-item">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
            </span>
            <span class="nav-label">My Courses</span>
            {% if active_enrollments.count %}
            <span class="nav-badge">{{ active_enrollments.count }}</span>
            {% endif %}
        </a>
        
        <a href="{% url 'courses:course_list' %}" class="dash-nav-item">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
            </span>
            <span class="nav-label">Browse Courses</span>
        </a>
        
        <!-- Account Section -->
        <span class="dash-nav-section">Account</span>
        
        <a href="{% url 'payments:payment_history' %}" class="dash-nav-item">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
            </span>
            <span class="nav-label">Payment History</span>
        </a>
        
        <a href="{% url 'notifications:notification_list' %}" class="dash-nav-item">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </span>
            <span class="nav-label">Notifications</span>
            {% if has_unread_notifications %}
            <span class="nav-badge nav-badge-red">{{ notification_unread_count }}</span>
            {% endif %}
        </a>
        
        <a href="{% url 'profiles:student_profile_edit' %}" class="dash-nav-item">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </span>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

<!-- Mobile Overlay -->
<div class="dash-overlay" id="dashOverlay" onclick="closeSidebar()"></div>

    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
}

    width: 38px;
