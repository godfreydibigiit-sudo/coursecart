{% if messages %}
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
    <div class="toast toast-{{ message.tags|default:'info' }}" role="alert" aria-live="assertive" aria-atomic="true" data-delay="5000">
        <div class="toast-icon">
            {% if message.tags == 'success' %}✅
            {% elif message.tags == 'error' %}❌
            {% elif message.tags == 'warning' %}⚠️
            {% elif message.tags == 'info' %}ℹ️
            {% else %}💬{% endif %}
        </div>
        <div class="toast-content">
            <p class="toast-message">{{ message }}</p>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close notification">✕</button>
    </div>
    {% endfor %}
</div>
{% endif %}
